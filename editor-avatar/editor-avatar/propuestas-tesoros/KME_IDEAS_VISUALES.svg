<text x="65" y="403" font-size="19" font-weight="700" fill="#000000" >Aplauso</text><svg x="190" y="371" width="45" height="45" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Aplauso: dos palmas que chocan y líneas de movimiento. Icono de una tinta. -->
  <rect x="4.6" y="7" width="6.6" height="14.5" rx="3.3" transform="rotate(-22 7.9 14.25)"/>
  <rect x="12.4" y="7" width="6.6" height="14.5" rx="3.3" transform="rotate(22 15.7 14.25)"/>
  <path d="M8.2 2.2l.9 2.4M12 1.5v2.6M15.8 2.2l-.9 2.4" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"/>
</svg>
<text x="248" y="403" font-size="25" font-weight="400" fill="#000000" >→</text><svg x="291" y="371" width="45" height="45" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M10 21L4 15Q2 13 4 12L7 14L4 7Q4 5 6 6L9 11L7 5Q7 3 9 4L12 11L11 6Q12 4 13 7L15 14Q17 18 14 21Z"/><path d="M16 7L18 4M19 10L22 9M16 16L19 15M16 2V1"/></g></svg><text x="370" y="403" font-size="19" font-weight="700" fill="#000000" >Mini corazón</text><svg x="529" y="371" width="45" height="45" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Mini corazón: dos dedos cruzados con un corazón pequeño encima, el gesto de los fans. -->
  <rect x="9.6" y="10" width="3.4" height="13" rx="1.7" transform="rotate(-17 11.3 16.5)"/>
  <rect x="11" y="10" width="3.4" height="13" rx="1.7" transform="rotate(17 12.7 16.5)"/>
  <path d="M12 9C9.2 7 8.2 5.6 8.2 4.1c0-1.2 1-2.2 2.2-2.2.7 0 1.2.3 1.6.8.4-.5.9-.8 1.6-.8 1.2 0 2.2 1 2.2 2.2 0 1.5-1 2.9-3.8 4.9z"/>
</svg>
<text x="584" y="403" font-size="25" font-weight="400" fill="#000000" >→</text><svg x="630" y="371" width="45" height="45" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 22L6 16Q5 14 7 14L10 16L9 10Q9 8 11 10L13 15L15 11Q17 9 17 12L16 18L14 22"/><path d="M14 7C9 4 10 1 12 1Q14 1 14 3Q15 0 17 1C20 3 16 6 14 7Z"/></g></svg><text x="65" y="463" font-size="19" font-weight="400" fill="#000000" >Probar a 20–24 px y con el nombre accesible.</text><text x="65" y="499" font-size="19" font-weight="400" fill="#000000" >Solo bocetos: decidir si mejoran la lectura.</text><text x="65" y="536" font-size="17" font-weight="400" fill="#000000" >No se cambian los SVG de Connect.</text><rect x="754" y="214" width="606" height="355" rx="20" fill="#fffdf9" stroke="#000000" stroke-width="1.5"/><text x="780" y="255" font-size="18" font-weight="800" fill="#000000" >EVENTOS · ENERGÍA COMPARTIDA</text><text x="780" y="298" font-size="20" font-weight="400" fill="#000000" >Boceto de estados · no define reglas</text><rect x="780" y="330" width="465" height="26" rx="13" fill="#f7f3ef" stroke="#000000" stroke-width="1"/><rect x="782" y="332" width="299.65" height="22" rx="11" fill="#e83475"/><text x="1270" y="352" font-size="22" font-weight="800" fill="#000000" >65%</text><text x="780" y="388" font-size="18" font-weight="400" fill="#000000" >La energía crece con vuestra presencia.</text><rect x="780" y="420" width="465" height="26" rx="13" fill="#f7f3ef" stroke="#000000" stroke-width="1"/><rect x="782" y="422" width="461" height="22" rx="11" fill="#e83475"/><text x="1270" y="442" font-size="22" font-weight="800" fill="#000000" >100%</text><text x="780" y="478" font-size="18" font-weight="400" fill="#000000" >Un recuerdo de haber estado juntos.</text><text x="780" y="539" font-size="16" font-weight="400" fill="#000000" >Sin parpadeos. Estado directo si reduces movimiento.</text><rect x="40" y="594" width="1320" height="320" rx="20" fill="#fffdf9" stroke="#000000" stroke-width="1.5"/><text x="65" y="638" font-size="18" font-weight="800" fill="#000000" >NO TODO TIENE QUE PEDIRTE VOLVER MAÑANA</text><text x="65" y="684" font-size="34" font-weight="750" fill="#000000" >Recuerdos, combinaciones y encuentros.</text><text x="65" y="728" font-size="24" font-weight="400" fill="#000000" >Una colección que cuenta tu historia, sin rachas ni clasificaciones.</text><text x="65" y="774" font-size="22" font-weight="400" fill="#000000" >Objetos del evento: una identidad común. Detalles personales: elección por decidir.</text><text x="65" y="817" font-size="22" font-weight="400" fill="#000000" >Sin precios en Mis tesoros. Sin huecos de «te falta». Sin presión para completar.</text><text x="65" y="861" font-size="20" font-weight="400" fill="#000000" >Animación propuesta: entrada breve y única. El estado final también se entiende sin ella.</text><rect x="40" y="939" width="1320" height="171" rx="20" fill="#fffdf9" stroke="#000000" stroke-width="1.5"/><text x="65" y="979" font-size="17" font-weight="800" fill="#000000" >CAPAS Y CUERPO · CRITERIOS PARA EL SIGUIENTE BLOQUE</text><text x="65" y="1018" font-size="21" font-weight="400" fill="#000000" >Objeto separado de gafas y auriculares · mango entre palma y mano · anclaje por anchura</text><text x="65" y="1055" font-size="21" font-weight="400" fill="#000000" >Comprobar cabello, mangas y ropa · sin recorte en los dos marcos ni en impresión</text><text x="40" y="1150" font-size="16" font-weight="400" fill="#000000" >Los objetos para otros tipos de evento solo se enumeran en el informe; aún no se dibujan.</text></g></svg>
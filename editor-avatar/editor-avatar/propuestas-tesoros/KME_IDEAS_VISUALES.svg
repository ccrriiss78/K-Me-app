<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1190" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Pequeños gestos, una misma identidad</title><desc id="descripcion">Grupo E · ideas visuales nuevas, sin implementar · Connect conserva sus decisiones D038.. Propuesta pendiente de aprobación; datos ficticios; no es una pantalla funcional.</desc><rect width="1400" height="1190" fill="#f7f3ef"/><g font-family="Segoe UI,Arial,sans-serif" fill="#000000"><text x="40" y="43" font-size="18" font-weight="800" fill="#000000" >K-ME / STUDIO</text><g transform="translate(215 25) scale(0.8)" stroke="#e83475" stroke-width="5" stroke-linecap="round"><path d="M0 16L9 0M13 16L22 0"/></g><text x="1360" y="43" font-size="15" font-weight="700" fill="#000000" text-anchor="end">PROPUESTA · DATOS FICTICIOS</text><text x="40" y="111" font-size="56" font-weight="850" fill="#000000" >Pequeños gestos, una misma identidad</text><text x="40" y="153" font-size="22" font-weight="400" fill="#000000" >Grupo E · ideas visuales nuevas, sin implementar · Connect conserva sus decisiones D038.</text><path d="M40 183H1360" stroke="#000000" stroke-width="1"/><rect x="40" y="214" width="690" height="355" rx="20" fill="#fffdf9" stroke="#000000" stroke-width="1.5"/><text x="65" y="255" font-size="18" font-weight="800" fill="#000000" >CONNECT · ANTES / PROPUESTA</text><text x="65" y="288" font-size="20" font-weight="400" fill="#000000" >Conservar marco y rubor de las caritas.</text><svg x="65" y="306" width="54" height="54" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Un poco de bajón: cejas tristes, ojos de punto y boca hacia abajo. -->

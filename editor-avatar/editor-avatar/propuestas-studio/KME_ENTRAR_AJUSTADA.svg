" font-weight="700" fill="#000000" >Usuario</text><rect x="610" y="313" width="616" height="53" rx="8" fill="#fffdf9" stroke="#000000" stroke-width="1.5"/><text x="610" y="410" font-size="18" font-weight="700" fill="#000000" >Contraseña</text><rect x="610" y="424" width="616" height="53" rx="8" fill="#fffdf9" stroke="#000000" stroke-width="1.5"/><rect x="610" y="506" width="21" height="21" rx="3" fill="#fffdf9" stroke="#000000" stroke-width="1.5"/><text x="644" y="524" font-size="17" font-weight="650" fill="#000000" >Mantener sesión abierta</text><text x="610" y="561" font-size="15" font-weight="400" fill="#000000" >Sin marcar, la sesión se cierra tras 24 h sin usar K-ME; marcada,</text><text x="610" y="585" font-size="15" font-weight="400" fill="#000000" >tras 7 días. No la marques en un ordenador compartido.</text><rect x="610" y="624" width="616" height="54" rx="8" fill="#000000" stroke="#000000" stroke-width="1.5"/><text x="918" y="659" font-size="20" font-weight="750" fill="#fffdf9" text-anchor="middle">Entrar</text><text x="610" y="723" font-size="17" font-weight="400" fill="#000000" >¿No tienes cuenta?</text><text x="760" y="723" font-size="17" font-weight="750" fill="#000000" >Crea una.</text><path d="M760 729H835" stroke="#e83475" stroke-width="3"/><text x="34" y="879" font-size="13" font-weight="400" fill="#000000" >Logo original y campos actuales · sin datos introducidos.</text><text x="1366" y="879" font-size="13" font-weight="400" fill="#000000" text-anchor="end">Solo propuesta visual · sin cambios en la app</text></g></svg>
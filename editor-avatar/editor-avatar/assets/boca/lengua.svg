<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
<!-- Capa: boca · Boca lengua · Lienzo 400×480 (usa assets/plantilla.svg como guía) -->
<g transform="translate(200 250)">
<!-- versión con labial: se muestra cuando el avatar tiene color de labial -->
<g class="con-labial"><path d="M-1,2 Q0,15 8,14 Q12,7 9,1 Z" fill="#ff7d93" stroke="#3d2f45" stroke-width="2.2" stroke-linejoin="round"/><path class="t-labial" d="M-13,-3 Q0,8 13,-3" fill="none" stroke="#e0607e" stroke-width="4.5" stroke-linecap="round"/></g>
<!-- versión sin labial -->
<g class="sin-labial"><path d="M-1,2 Q0,15 8,14 Q12,7 9,1 Z" fill="#ff7d93" stroke="#3d2f45" stroke-width="2.2" stroke-linejoin="round"/><path d="M-13,-3 Q0,8 13,-3" fill="none" stroke="#3d2f45" stroke-width="4" stroke-linecap="round"/></g>
</g>
</svg>
